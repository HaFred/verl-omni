# Co-RL UND AR deploy (Thinker). Sibling of bagel_corl_deploy.yaml (GEN / bagel_single_stage).
#
# Uses registered ``bagel_think`` so stage-0 LLM_AR decodes planning / tool tokens
# (Hermes ``<tool_call>``) before any KV transfer. Do NOT use bagel_single_stage here —
# that is DiffusionStrategy / GEN-only.
#
# Passed from run_agentic_bagel_rpco_lora.sh as BAGEL_UND_DEPLOY_CONFIG and from
# run_bagel_und_ar_serve.sh for the spike_und_hermes.py gate.
#
# Layout note: stock bagel_think pins both stages to devices:"0". The serve helper
# overrides stage devices (Thinker on logical 0, DiT on logical 1) when two GPUs
# are visible. For 1-GPU smoke, leave both on "0" and lower util.

pipeline: bagel_think
async_chunk: false

stages:
  - stage_id: 0
    # Bagel registers as encoder-decoder in vLLM-Omni, which forces
    # disable_chunked_mm_input=True and pins the MM encoder budget to
    # max_num_batched_tokens. The Bagel image processor emits ~8625 tokens per
    # image, so 2048 aborts engine init with:
    #   ValueError: Chunked MM input disabled but max_tokens_per_mm_item (8625)
    #   is larger than max_num_batched_tokens (2048).
    # 16384 keeps max_num_batched_tokens == max_num_seqs * max_model_len, so the
    # scheduler's seq*len warning stays silent, and leaves prompt headroom.
    max_model_len: 16384
    max_num_batched_tokens: 16384
    max_num_seqs: 1
    gpu_memory_utilization: 0.45
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.7
      top_p: 0.9
      top_k: 50
      max_tokens: 512
      seed: 42
      detokenize: true
      repetition_penalty: 1.05

  - stage_id: 1
    max_num_batched_tokens: 2048
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 42

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector
